# =============================================================================
# AI-Powered Incident Intelligence Platform
# Conda Environment Configuration
# First Citizens Bank - Enterprise Deployment
# =============================================================================
# Usage:
#   conda env create -f environment.yml
#   conda activate incident_intelligence
#   conda env update -f environment.yml --prune   # to update existing env
# =============================================================================

name: incident_intelligence

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python Runtime ────────────────────────────────────────────────────────
  - python=3.11

  # ── Core Data Science ─────────────────────────────────────────────────────
  - pandas=2.2.*
  - numpy=1.26.*
  - scipy=1.13.*

  # ── Machine Learning ──────────────────────────────────────────────────────
  - scikit-learn=1.5.*
  - catboost=1.2.*
  - faiss-cpu=1.8.*
  - joblib=1.4.*

  # ── Visualization ─────────────────────────────────────────────────────────
  - matplotlib=3.9.*
  - seaborn=0.13.*

  # ── Reporting & Export ────────────────────────────────────────────────────
  - openpyxl=3.1.*
  - xlsxwriter=3.2.*

  # ── Configuration & Validation ────────────────────────────────────────────
  - pyyaml=6.0.*
  - pydantic=2.10.*
  - python-dotenv=1.1.*

  # ── Testing ───────────────────────────────────────────────────────────────
  - pytest=8.3.*
  - pytest-cov=6.1.*
  - pytest-mock=3.14.*

  # ── Utilities ─────────────────────────────────────────────────────────────
  - tqdm=4.67.*
  - rich=13.9.*
  - click=8.1.*

  # ── Pip-Only Packages ────────────────────────────────────────────────────
  # These packages are not available or better managed via pip
  - pip:
      - shap==0.46.*
      - structlog==24.4.*
      - pydantic-settings==2.7.*
