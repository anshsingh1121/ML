# Model Configuration for Incident Intelligence Platform
# First Citizens Bank - Phase 1

models:
  assignment_group:
    algorithm: catboost
    params:
      iterations: 300
      depth: 6
      learning_rate: 0.1
      random_seed: 42
      verbose: 0

  resolution_time_hours:
    algorithm: catboost
    params:
      iterations: 150
      depth: 6
      learning_rate: 0.1
      loss_function: MAE
      random_seed: 42
      verbose: 0

hyperparameter_optimization:
  method: randomized_search
  cv_folds: 5
  n_iter: 50
  scoring: f1_weighted
  param_distributions:
    iterations: [100, 150, 200, 300, 500]
    depth: [4, 6, 8, 10]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    l2_leaf_reg: [1, 3, 5, 7, 9]

embeddings:
  model_name: tfidf-svd-384
  batch_size: 64
  max_seq_length: 256
  normalize: true
  cache_dir: models/embeddings

faiss:
  index_type: IVFFlat
  nlist: 100
  nprobe: 10
  auto_switch_threshold: 50000
  index_dir: indexes

similarity:
  semantic_weight: 0.7
  structural_weight: 0.3
  top_k: 10
  min_similarity_score: 0.5

training:
  test_size: 0.2
  validation_size: 0.1
  stratify: true
  random_state: 42

feature_engineering:
  text_features:
    - short_description
    - description
  categorical_features:
    - category
    - subcategory
    - impact
    - urgency
    - contact_type
  numerical_features:
    - reassignment_count
    - reopen_count
  target_columns:
    - assignment_group
    - resolution_time_hours

hybrid:
  catboost_weight: 0.60
  semantic_weight: 0.40
  agreement_bonus: 0.10
  disagreement_penalty: 0.05
  insufficient_matches_penalty: 0.10
  partial_reassign_credit: 0.50
  very_high_threshold: 0.88
  high_threshold: 0.75
  moderate_threshold: 0.60
  low_threshold: 0.45
  catboost_dominant_threshold: 0.70
  mttr_catboost_weight: 0.50
  mttr_semantic_weight: 0.50
  default_top_k: 5
